<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 260" width="320" height="260">
  <style>
    .f{fill:#1a1a1a}
    .e{fill:#FFB300}
    .m{fill:#c8c8c8}
    .n{fill:#1a1a1a}
    @media(prefers-color-scheme:dark){
      .f{fill:#e8e8e8}
      .m{fill:#f0f0f0}
      .n{fill:#333}
    }
  </style>
  <!-- Row 0: ear tips -->
  <rect class="f" x="20"  y="0"   width="40"  height="20"/>
  <rect class="f" x="260" y="0"   width="40"  height="20"/>
  <!-- Row 1: ears -->
  <rect class="f" x="0"   y="20"  width="80"  height="20"/>
  <rect class="f" x="240" y="20"  width="80"  height="20"/>
  <!-- Row 2: ear base -->
  <rect class="f" x="0"   y="40"  width="100" height="20"/>
  <rect class="f" x="220" y="40"  width="100" height="20"/>
  <!-- Row 3: forehead -->
  <rect class="f" x="0"   y="60"  width="320" height="20"/>
  <!-- Rows 4-5: eyes (eye rects span both rows) -->
  <rect class="f" x="0"   y="80"  width="60"  height="20"/>
  <rect class="e" x="60"  y="80"  width="40"  height="40"/>
  <rect class="f" x="100" y="80"  width="120" height="20"/>
  <rect class="e" x="220" y="80"  width="40"  height="40"/>
  <rect class="f" x="260" y="80"  width="60"  height="20"/>
  <rect class="f" x="0"   y="100" width="60"  height="20"/>
  <rect class="f" x="100" y="100" width="120" height="20"/>
  <rect class="f" x="260" y="100" width="60"  height="20"/>
  <!-- Row 6: brow -->
  <rect class="f" x="0"   y="120" width="320" height="20"/>
  <!-- Row 7: muzzle top -->
  <rect class="f" x="20"  y="140" width="60"  height="20"/>
  <rect class="m" x="80"  y="140" width="160" height="20"/>
  <rect class="f" x="240" y="140" width="60"  height="20"/>
  <!-- Row 8: nose -->
  <rect class="f" x="20"  y="160" width="40"  height="20"/>
  <rect class="m" x="60"  y="160" width="60"  height="20"/>
  <rect class="n" x="120" y="160" width="80"  height="20"/>
  <rect class="m" x="200" y="160" width="60"  height="20"/>
  <rect class="f" x="260" y="160" width="40"  height="20"/>
  <!-- Row 9: lower muzzle -->
  <rect class="f" x="20"  y="180" width="40"  height="20"/>
  <rect class="m" x="60"  y="180" width="200" height="20"/>
  <rect class="f" x="260" y="180" width="40"  height="20"/>
  <!-- Row 10: fangs with open mouth gap -->
  <rect class="f" x="20"  y="200" width="60"  height="20"/>
  <rect class="m" x="80"  y="200" width="40"  height="20"/>
  <rect class="m" x="200" y="200" width="40"  height="20"/>
  <rect class="f" x="240" y="200" width="60"  height="20"/>
  <!-- Row 11: chin -->
  <rect class="f" x="20"  y="220" width="280" height="20"/>
  <!-- Row 12: neck -->
  <rect class="f" x="40"  y="240" width="240" height="20"/>
</svg>
